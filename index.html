<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>どうし かるた</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #d8b26e;
      text-align: center;
    }

    header {
      background: #7a4a20;
      color: white;
      padding: 10px;
      font-size: 24px;
      font-weight: bold;
    }

    .question-area {
      background: #fff8dc;
      margin: 8px auto;
      padding: 8px;
      width: 94%;
      max-width: 700px;
      border-radius: 15px;
    }

    .question-label {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .question-word {
      font-size: 42px;
      font-weight: bold;
      color: #d35400;
      margin: 4px;
    }

    button {
      font-size: 18px;
      margin: 4px;
      padding: 8px 18px;
      border: none;
      border-radius: 12px;
      background: #3498db;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #217dbb;
    }

    .message {
      font-size: 26px;
      font-weight: bold;
      color: #c0392b;
      min-height: 32px;
      margin: 4px;
    }

    .score {
      font-size: 18px;
      margin: 4px;
    }

    .karuta-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 12px;
      padding: 12px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border: 4px solid #333;
      border-radius: 16px;
      min-height: 165px;
      padding: 5px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 3px 4px 8px rgba(0,0,0,0.28);
      user-select: none;
    }

    .card:hover {
      background: #fff4c2;
      transform: scale(1.03);
    }

    .card img {
      width: 145px;
      height: 145px;
      object-fit: contain;
      pointer-events: none;
    }

    .correct {
      background: #b8f5b8 !important;
      border-color: #27ae60;
    }

    .wrong {
      background: #ffb3b3 !important;
      border-color: #e74c3c;
    }

    .hidden {
      visibility: hidden;
    }

    .no-image {
      font-size: 13px;
      color: #999;
      line-height: 1.4;
      word-break: break-all;
    }

    /* タブレット・スマホ用 */
    @media (max-width: 700px) {
      .karuta-board {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 8px;
      }

      .card {
        min-height: 125px;
        border-radius: 14px;
        padding: 3px;
      }

      .card img {
        width: 110px;
        height: 110px;
      }

      .question-word {
        font-size: 36px;
      }

      button {
        font-size: 16px;
        padding: 7px 14px;
      }
    }

    /* とても小さい画面用 */
    @media (max-width: 420px) {
      .karuta-board {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 6px;
      }

      .card {
        min-height: 105px;
      }

      .card img {
        width: 95px;
        height: 95px;
      }

      header {
        font-size: 22px;
      }

      .question-word {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>どうし かるた</header>

<div class="question-area">
  <div class="question-label">よまれた ことばの えを タッチしよう</div>
  <div id="question" class="question-word">スタート</div>

  <button onclick="startGame()">スタート</button>
  <button onclick="resetGame()">リセット</button>

  <div class="message" id="message"></div>
  <div class="score" id="score">0 / 12</div>
</div>

<div id="board" class="karuta-board"></div>

<script>
const cards = [
  { word: "あう", img: "images/au.png" },
  { word: "あける", img: "images/akeru.png" },
  { word: "あたたまる", img: "images/atatamaru.png" },
  { word: "あるく", img: "images/aruku.png" },
  { word: "いわう", img: "images/iwau.png" },

  { word: "うたう", img: "images/utau.png" },
  { word: "おこる", img: "images/okoru.png" },
  { word: "およぐ", img: "images/oyogu.png" },
  { word: "おす", img: "images/osu.png" },
  { word: "かく", img: "images/kaku.png" },

  { word: "きく", img: "images/kiku.png" },
  { word: "きる", img: "images/kiru.png" },
  { word: "けずる", img: "images/kezuru.png" },
  { word: "ける", img: "images/keru.png" },

  { word: "こまる", img: "images/komaru.png" },
  { word: "さがす", img: "images/sagasu.png" },
  { word: "しく", img: "images/shiku.png" },
  { word: "しめる", img: "images/shimeru.png" },
  { word: "すべる", img: "images/suberu.png" },

  { word: "すわる", img: "images/suwaru.png" },
  { word: "たたむ", img: "images/tatamu.png" },
  { word: "たつ", img: "images/tatsu.png" },
  { word: "とぶ", img: "images/tobu.png" },
  { word: "なく", img: "images/naku.png" },

  { word: "なげる", img: "images/nageru.png" },
  { word: "ぬぐ", img: "images/nugu.png" },
  { word: "ねる", img: "images/neru.png" },
  { word: "のむ", img: "images/nomu.png" },
  { word: "のぼる", img: "images/noboru.png" },

  { word: "はく", img: "images/haku.png" },
  { word: "ひく", img: "images/hiku.png" },
  { word: "かんがえる", img: "images/kangaeru.png" },
  { word: "みる", img: "images/miru.png" },
  { word: "めくる", img: "images/mekuru.png" },

  { word: "わかる", img: "images/wakaru.png" },
  { word: "わる", img: "images/waru.png" },
  { word: "わらう", img: "images/warau.png" },
  { word: "あらう", img: "images/arau.png" },
  { word: "はしる", img: "images/hashiru.png" }
];

const DISPLAY_COUNT = 12;

let gameCards = [];
let remaining = [];
let current = "";
let scoreCount = 0;
let gameStarted = false;

function shuffle(array) {
  const copied = [...array];
  for (let i = copied.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = copied[i];
    copied[i] = copied[j];
    copied[j] = temp;
  }
  return copied;
}

function makeRandomCards() {
  gameCards = shuffle(cards).slice(0, DISPLAY_COUNT);
}

function makeBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  gameCards.forEach(card => {
    const div = document.createElement("div");
    div.className = "card";

    const img = document.createElement("img");
    img.src = card.img;
    img.alt = card.word;

    img.onerror = function() {
      div.innerHTML = `
        <div class="no-image">
          画像なし<br>
          ${card.img}
        </div>
      `;
    };

    div.appendChild(img);

    div.onclick = function() {
      checkAnswer(div, card.word);
    };

    board.appendChild(div);
  });
}

function startGame() {
  remaining = shuffle(gameCards.map(card => card.word));
  current = "";
  scoreCount = 0;
  gameStarted = true;

  document.getElementById("message").textContent = "";
  updateScore();
  nextQuestion();
}

function nextQuestion() {
  if (remaining.length === 0) {
    current = "";
    document.getElementById("question").textContent = "おわり";
    document.getElementById("message").textContent = "ぜんぶ とれました！";
    return;
  }

  current = remaining[0];
  document.getElementById("question").textContent = current;
  document.getElementById("message").textContent = "";
}

function checkAnswer(cardElement, selectedWord) {
  if (!gameStarted) {
    document.getElementById("message").textContent = "スタートを おしてね";
    return;
  }

  if (selectedWord === current) {
    cardElement.classList.add("correct");
    document.getElementById("message").textContent = "せいかい！";

    setTimeout(function() {
      cardElement.classList.add("hidden");
    }, 300);

    remaining.shift();
    scoreCount++;
    updateScore();

    setTimeout(function() {
      nextQuestion();
    }, 600);

  } else {
    cardElement.classList.add("wrong");
    document.getElementById("message").textContent = "もういちど";

    setTimeout(function() {
      cardElement.classList.remove("wrong");
    }, 300);
  }
}

function updateScore() {
  document.getElementById("score").textContent =
    scoreCount + " / " + gameCards.length;
}

function resetGame() {
  gameStarted = false;
  current = "";
  scoreCount = 0;
  remaining = [];

  document.getElementById("question").textContent = "スタート";
  document.getElementById("message").textContent = "";

  makeRandomCards();
  makeBoard();
  updateScore();
}

/* ページを開いたときに、39この中から12こランダム表示 */
makeRandomCards();
makeBoard();
updateScore();
</script>

</body>
</html>
